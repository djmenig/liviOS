# ============================================================
# LiviOS antiX Edition - build-iso.conf
# Recipe-based ISO build configuration for build-iso-mx
#
# Usage:
#   export LIVIOS_ROOT=/path/to/liviOS-repo-root
#   build-iso --conf ${LIVIOS_ROOT}/editions/antix/build-iso.conf
# ============================================================

# ------------------------------------------------------------
# Base System
# ------------------------------------------------------------
base_system="antix-core"
debian_branch="bookworm"
arch="i386"

# ------------------------------------------------------------
# ISO Metadata
# ------------------------------------------------------------
iso_name="liviOS-antix"
iso_label="LIVIOS_ANTIX"
iso_version="1.0"
iso_fullname="LiviOS antiX Edition"
iso_publisher="LiviOS Project"
iso_application="LiviOS Live System"
iso_pretty_name="LiviOS antiX Edition"

# ------------------------------------------------------------
# Overlay (LiviOS custom rootfs)
# ------------------------------------------------------------
custom_rootfs="${LIVIOS_ROOT:?LIVIOS_ROOT not set}/editions/antix/rootfs"

# ------------------------------------------------------------
# Hooks & Scripts
# ------------------------------------------------------------
pre_chroot_hook="${LIVIOS_ROOT}/editions/antix/scripts/pre-chroot.sh"
in_chroot_hook="${LIVIOS_ROOT}/editions/antix/scripts/in-chroot.sh"
post_chroot_hook="${LIVIOS_ROOT}/editions/antix/scripts/post-chroot.sh"

# ------------------------------------------------------------
# antiX Configuration Paths (inside build-iso-mx repo)
# ------------------------------------------------------------
antix_skel="skel/antix"
antix_hooks="hooks/antix"
antix_templates="templates/antix"
antix_packages="packages/antix"

# ------------------------------------------------------------
# Live User
# ------------------------------------------------------------
live_user="demo"
live_user_fullname="LiviOS Demo User"
live_user_password="demo"
root_password="root"

# ------------------------------------------------------------
# Bootloader
# ------------------------------------------------------------
use_grub="yes"
use_syslinux="yes"

# ------------------------------------------------------------
# Kernel
# ------------------------------------------------------------
kernel_flavor="default"
kernel_version="auto"

# ------------------------------------------------------------
# SquashFS Options
# ------------------------------------------------------------
mksquashfs_options="-comp xz -Xbcj x86 -b 1M -Xdict-size 100%"

# ------------------------------------------------------------
# Cleanup
# ------------------------------------------------------------
remove_apt_cache="yes"
remove_logs="yes"
remove_docs="no"
remove_locales="no"
remove_manpages="no"

# ------------------------------------------------------------
# ISO Output
# ------------------------------------------------------------
iso_output_dir="${LIVIOS_ROOT}/output"

# ============================================================
# End of build-iso.conf
# ============================================================
