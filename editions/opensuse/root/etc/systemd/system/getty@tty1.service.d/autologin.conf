# LiviOS openSUSE edition - tty1 autologin
#
# openSUSE is systemd-based. To reproduce the antiX edition's tty1 autologin
# (runit getty service / sysvinit inittab) we override the getty@tty1 unit to
# pass --autologin demo.
#
# The overlay path (edge in the live system) resolves via the getty@ template,
# so this file is installed as:
#   /etc/systemd/system/getty@tty1.service.d/autologin.conf

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin demo --noclear 38400 tty1 linux
