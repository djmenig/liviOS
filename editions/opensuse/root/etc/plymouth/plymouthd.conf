# LiviOS openSUSE edition - plymouth daemon config
#
# Selects the custom 'livios' script theme (planet splash). Requires the
# plymouth-plugin-script package. Written statically here so the default theme
# is deterministic; config.sh also runs 'plymouth-set-default-theme livios'
# with this as the fallback.

[Daemon]
Theme=livios
ShowDelay=0